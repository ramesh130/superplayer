# Robolectric ships a fixed set of Android runtimes and cannot run on an SDK level it has no
# android-all jar for. The modules compile against the `compileSdk` in the version catalog, which
# moves ahead of Robolectric's newest supported level whenever a new Android release lands, so
# leaving this unset makes every test fail with "Robolectric does not support SDK <n>" until
# Robolectric catches up.
#
# NEWEST_SDK is the newest level Robolectric itself supports, so this tracks upward on a Robolectric
# upgrade without anyone editing a number here. Tests that need a specific level say so with
# @Config(sdk = [...]) on the test itself.
sdk=NEWEST_SDK
