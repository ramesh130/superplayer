# Continuous integration: build, test, lint.
#
# Runs on demand only, from the Actions tab or `gh workflow run ci.yml --ref <branch>`, once a
# phase is complete. Per-push runs were switched off to stay inside the GitHub Actions minutes
# budget, so between phases `./gradlew assemble check` locally is the only gate.
#
# The steps are the same commands a contributor runs locally; CONTRIBUTING.md lists them and
# is the place that explains what belongs in `check`. The narrower steps before `check` exist
# only so a failure is attributable at a glance in the run log.
name: CI

# To restore per-change runs, bring back `push:` and `pull_request:` beside the dispatch
# trigger. Both were there: a push to a branch with no pull request still needs checking, and
# a pull request from a fork is not covered by `push`.
on:
  workflow_dispatch:

# One in-flight run per ref. A new push makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The wrapper JAR is a committed binary that the build executes. Verify it is a
      # genuine Gradle distribution before running it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches `jvmTarget` in gradle/libs.versions.toml, build-logic's toolchain, and the daemon
          # JVM criteria in gradle/gradle-daemon-jvm.properties (and demo/'s and benchmark/'s copies).
          java-version: '17'

      # The SDK and the compileSdk platform, looked up from the version catalog. A composite
      # action because the device workflow needs exactly the same thing; the reasoning for the
      # lookup lives with it.
      - name: Set up the Android SDK
        uses: ./.github/actions/setup-android-sdk

      # Caches the Gradle user home — the dependency cache and the local build cache — so a
      # run reuses the previous one's downloads and task outputs. Only default-branch runs
      # write the cache, so pull requests read a warm cache without poisoning it.
      #
      # The configuration cache is NOT carried across runs: `setup-gradle` only persists it
      # when given a `cache-encryption-key`, because a configuration-cache entry can contain
      # credentials read at configuration time. Enabling that means adding a repository
      # secret; until then each run pays configuration cost once, which is the smaller half.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build every module
        run: ./gradlew assemble

      - name: Unit tests
        run: ./gradlew test

      # `check` runs Android Lint, the repo-wide Media3 version verification, the tracked
      # public API surface checks, the Kotlin format and Apache-2.0 file headers, devicelab's
      # device-free self-test, and the build-logic test suite, which is an included build and
      # therefore invisible to the root build's `test` above.
      #
      # The QoE regression gate is not a step of its own: it is a unit test of `superplayer-abr`, so
      # `test` above runs it, and `docs/testing.md` says why it lives there rather than in a
      # benchmark step below.
      #
      # Spotless is configured by path rather than by project, so this covers the demo's and
      # build-logic's Kotlin files as well as the library modules'. `./gradlew spotlessApply`
      # is the local fix.
      #
      # The API surface checks are why there is no separate step for them: `check` is the whole
      # definition of passing, so a contributor running it locally sees exactly what CI sees.
      # A public API change that has not been regenerated with `./gradlew updateApiSurface`
      # fails here, as does an @UnstableApi Media3 type reaching public API.
      - name: Lint, API surface, and repo verification
        run: ./gradlew check

      - name: Publish to the local Maven repository
        run: ./gradlew publishToMavenLocal

      # The demo is a separate build that resolves SuperPlayer from published coordinates,
      # exactly as an adopter would, so a broken POM or a missing transitive dependency
      # fails here rather than in someone else's app.
      # Linted as well as built: lint configuration lives in the library convention plugin,
      # which the demo does not apply, so this is the only thing that lints it. It is also the
      # only place `UnsafeOptInUsageError` is enabled, which makes this step the proof of
      # ADR-0001 rule 2 from a consumer's side — a leaked @UnstableApi type that the library's
      # own checks somehow missed still fails here, at the call site, where it would hurt.
      # `spotlessCheck` is here rather than left to the root `check` for the same reason: the
      # demo applies Spotless itself, so its sources stay covered even when this step is the
      # only thing running.
      - name: Build and lint the demo against the published artifacts
        working-directory: demo
        run: ./gradlew assembleDebug lintDebug spotlessCheck

      # The benchmark is a third separate build, and it resolves SuperPlayer from published
      # coordinates exactly as the demo does — so this step, like the one above, is where a broken
      # POM or a missing transitive dependency surfaces.
      #
      # `test` rather than a matrix run: it is the harness's own tests plus the matrix at one run per
      # cell, which is what keeps the runner working between baselines without costing CI the
      # three quarters of an hour a real baseline takes. A benchmark is a measurement somebody reads
      # rather than a check a change must pass — `benchmark/README.md` says why — so nothing here
      # gates on a number.
      #
      # `spotlessCheck` for the same reason as the demo's: this build applies Spotless itself and CI
      # runs it with none of the root build running.
      - name: Build and smoke-run the benchmark against the published artifacts
        working-directory: benchmark
        run: ./gradlew assembleDebug test spotlessCheck

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
