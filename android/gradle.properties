org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The repository root, as a path from this directory (#519). The Swift package, docs/, config/,
# LICENSE, CHANGELOG.md, third-party/ and devicelab/ are the repository's rather than the Gradle
# build's, and every Gradle path to them is resolved from here; the two roots are one directory
# today, and moving the Android builds under android/ (#521) makes this `..`. `demo/`, `benchmark/`
# and build-logic's tests read this line too, so it is written once. RepositoryRoot.kt argues it.
superplayer.repositoryRoot=.
