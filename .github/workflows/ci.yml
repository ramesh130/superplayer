# Continuous integration: build, test, lint.
#
# Runs on every push and every pull request, so a broken change is caught before review
# rather than after merge.
#
# The steps are the same commands a contributor runs locally; CONTRIBUTING.md lists them and
# is the place that explains what belongs in `check`. The narrower steps before `check` exist
# only so a failure is attributable at a glance in the run log.
name: CI

# Both triggers, deliberately: pushes to a branch with no pull request still have to be
# checked, and a pull request from a fork is not covered by `push`. The cost is that a
# same-repo pull request runs twice — `refs/heads/*` and `refs/pull/N/merge` are different
# refs, so the concurrency group below cannot collapse them.
on:
  push:
  pull_request:

# One in-flight run per ref. A new push makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The wrapper JAR is a committed binary that the build executes. Verify it is a
      # genuine Gradle distribution before running it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches `jvmTarget` in gradle/libs.versions.toml and build-logic's toolchain.
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Installed explicitly in the next step instead, from the version catalog.
          packages: ''

      # The runner image does not ship every platform, and relying on AGP's implicit SDK
      # download makes the build fail late and obscurely when the platform is missing. The
      # level is read from the version catalog rather than written here, so it cannot drift
      # from what the modules actually compile against.
      #
      # The package id is looked up rather than constructed: platforms are published both
      # unsuffixed and minor-versioned — `platforms;android-36` but `platforms;android-37.0`
      # — so `android-$compile_sdk` is not reliably a real package name. Where an API level
      # has several minors, the lowest is the base SDK for that level, which is what a bare
      # `compileSdk = 37` means, so the sort takes the first and not the last. On no match this
      # prints what the channel does offer, because "the pinned compileSdk is not available"
      # is a fact worth reading directly rather than inferring from a later build failure.
      - name: Install the pinned compileSdk platform
        run: |
          compile_sdk="$(sed -n 's/^compileSdk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$compile_sdk" || { echo "compileSdk not found in gradle/libs.versions.toml"; exit 1; }

          package="$(sdkmanager --list 2>/dev/null \
            | sed -n "s/^ *\(platforms;android-${compile_sdk}\(\.[0-9][0-9]*\)*\) .*/\1/p" \
            | sort -Vu | head -1)"

          if [ -z "$package" ]; then
            echo "No SDK platform package matches compileSdk $compile_sdk. Available platforms:"
            sdkmanager --list 2>/dev/null | sed -n 's/^ *\(platforms;[^ ]*\) .*/  \1/p' | sort -Vu
            exit 1
          fi

          echo "Installing $package"
          sdkmanager --install "$package"

      # Caches the Gradle user home — the dependency cache and the local build cache — so a
      # run reuses the previous one's downloads and task outputs. Only default-branch runs
      # write the cache, so pull requests read a warm cache without poisoning it.
      #
      # The configuration cache is NOT carried across runs: `setup-gradle` only persists it
      # when given a `cache-encryption-key`, because a configuration-cache entry can contain
      # credentials read at configuration time. Enabling that means adding a repository
      # secret; until then each run pays configuration cost once, which is the smaller half.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build every module
        run: ./gradlew assemble

      - name: Unit tests
        run: ./gradlew test

      # `check` runs Android Lint, the repo-wide Media3 version verification, the tracked
      # public API surface checks, the Kotlin format and Apache-2.0 file headers, and the
      # build-logic test suite, which is an included build and therefore invisible to the root
      # build's `test` above.
      #
      # Spotless is configured by path rather than by project, so this covers the demo's and
      # build-logic's Kotlin files as well as the library modules'. `./gradlew spotlessApply`
      # is the local fix.
      #
      # The API surface checks are why there is no separate step for them: `check` is the whole
      # definition of passing, so a contributor running it locally sees exactly what CI sees.
      # A public API change that has not been regenerated with `./gradlew updateApiSurface`
      # fails here, as does an @UnstableApi Media3 type reaching public API.
      - name: Lint, API surface, and repo verification
        run: ./gradlew check

      - name: Publish to the local Maven repository
        run: ./gradlew publishToMavenLocal

      # The demo is a separate build that resolves SuperPlayer from published coordinates,
      # exactly as an adopter would, so a broken POM or a missing transitive dependency
      # fails here rather than in someone else's app.
      # Linted as well as built: lint configuration lives in the library convention plugin,
      # which the demo does not apply, so this is the only thing that lints it. It is also the
      # only place `UnsafeOptInUsageError` is enabled, which makes this step the proof of
      # ADR-0001 rule 2 from a consumer's side — a leaked @UnstableApi type that the library's
      # own checks somehow missed still fails here, at the call site, where it would hurt.
      # `spotlessCheck` is here rather than left to the root `check` for the same reason: the
      # demo applies Spotless itself, so its sources stay covered even when this step is the
      # only thing running.
      - name: Build and lint the demo against the published artifacts
        working-directory: demo
        run: ./gradlew assembleDebug lintDebug spotlessCheck

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
