# The single source of truth for every dependency version in this build.
#
# ADR-0001 rule 3: Media3's version is declared in exactly one place. No module may pin a
# Media3 version in its own build script; every module resolves it from this catalog.
# `./gradlew verifyNoHardcodedMedia3Versions` enforces that mechanically.

[versions]
# --- The published version of SuperPlayer itself. Both builds read it from here. ---
superplayer = "0.1.0-SNAPSHOT"

# --- Build toolchain ---
agp = "9.4.0"
kotlin = "2.4.10"
jvmTarget = "17"

# --- Android SDK levels ---
compileSdk = "37"
minSdk = "24"
targetSdk = "37"

# --- The pinned Media3 version. Change it here and nowhere else. ---
media3 = "1.11.0"

# --- Libraries ---
coroutines = "1.11.0"
androidxAnnotation = "1.9.1"
junit = "4.13.2"
# Robolectric is declared explicitly as well as arriving with `media3-test-utils-robolectric`,
# because that artifact is an AAR whose own dependencies are runtime-scoped: its shadows are on
# the test *runtime* classpath but not the test *compile* classpath, so a test that names a
# shadow type — `ShadowPowerManager`, say — does not compile without this. Keep it equal to the
# version Media3 resolves, so the two declarations cannot pull in two Robolectrics.
robolectric = "4.16"

# --- Demo app only: Jetpack Compose. The library modules have no Compose dependency. ---
# The BOM pins every `androidx.compose.*` artifact, so the individual Compose libraries below
# carry no version of their own and cannot drift apart from each other.
composeBom = "2026.08.00"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"

# --- Build-time only: the engine behind the tracked public API surface ---
# `binary-compatibility-validator` is used as a library, not as its Gradle plugin: the plugin
# keys on the `kotlin-android` plugin id, which AGP 9's built-in Kotlin support does not apply.
# build-logic drives its signature loader directly instead. See docs/api-surface.md.
binaryCompatibilityValidator = "0.18.2"
asm = "9.9"

[libraries]
# Media3. Every entry resolves `media3` above.
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-test-utils = { module = "androidx.media3:media3-test-utils", version.ref = "media3" }
media3-test-utils-robolectric = { module = "androidx.media3:media3-test-utils-robolectric", version.ref = "media3" }

androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Compose, used by the demo app only.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

binary-compatibility-validator = { module = "org.jetbrains.kotlinx:binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }

# Gradle plugin artifacts, so build-logic can depend on them.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# The Compose compiler ships with Kotlin, so it resolves the catalog's Kotlin version by
# definition rather than by convention.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
