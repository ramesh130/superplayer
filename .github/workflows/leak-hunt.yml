# The leak hunt (#50), run by hand against main once a phase is complete: the demo driven through devicelab's `leak-hunt` scenario
# on an emulator, with the report, the heap dumps and the native profiles uploaded as one artifact.
#
# Scheduled rather than per pull request. A run takes about 23 minutes on a local headless emulator,
# more on a CI runner — how much more, its first night will say — and it is not perfectly stable, and a check that is slow and occasionally red on every pull request trains
# people to ignore it. A red night is a finding to read: the run's report names what grew and the
# fields that retain it. devicelab/leak/README.md is the manual.
#
# The same command line as `./gradlew huntLeaks`, through the reusable device workflow.
name: Leak hunt

# On demand only, from the Actions tab or `gh workflow run leak-hunt.yml`, once a phase is complete.
# The nightly schedule was switched off to stay inside the GitHub Actions minutes budget. To restore
# it, bring back:
#   schedule:
#     # 03:17 UTC: off the hour, when scheduled runs queue behind everyone else's.
#     - cron: '17 3 * * *'
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    uses: ./.github/workflows/device-run.yml
    with:
      scenario: leak-hunt
      artifact-name: leak-hunt
      timeout-minutes: 120
