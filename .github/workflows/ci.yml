# Continuous integration: build, test, lint.
#
# The steps are the same commands a contributor runs locally; CONTRIBUTING.md lists them and
# is the place that explains what belongs in `check`. The narrower steps before `check` exist
# only so a failure is attributable at a glance in the run log.
name: CI

# Per-change runs, restored now that the repository is one other people can send changes to.
#
# They were switched off while this was a private repository, to stay inside the Actions
# minutes budget, which made `./gradlew assemble check` on the author's own machine the only
# gate. That is a reasonable arrangement for one person and an unreasonable thing to ask of a
# contributor: nobody should have to take "it passed locally" on trust, in either direction.
# The budget argument also lapses with privacy — standard runners are free for public
# repositories — so the constraint that justified the dispatch-only trigger no longer exists.
#
# `pull_request` rather than `push` alone is the load-bearing half: a pull request from a fork
# is not a push to this repository and `push` never sees one, so a fork's change would arrive
# ungated. `push` is restricted to the default branch, where it checks the *result* of a merge
# rather than the branch that was merged — a rebase replays commits onto a head none of them
# was tested against, and this is what catches a replay that lands broken. Leaving `push`
# unrestricted would instead run every topic branch twice, once as a push and once as its own
# pull request, for one answer. A branch with no pull request open is still reachable by hand
# through `workflow_dispatch`.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# One in-flight run per ref. A new push makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The wrapper JAR is a committed binary that the build executes. Verify it is a
      # genuine Gradle distribution before running it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches `jvmTarget` in gradle/libs.versions.toml, build-logic's toolchain, and the daemon
          # JVM criteria in gradle/gradle-daemon-jvm.properties (and demo/'s and benchmark/'s copies).
          java-version: '17'

      # The SDK and the compileSdk platform, looked up from the version catalog. A composite
      # action because the device workflow needs exactly the same thing; the reasoning for the
      # lookup lives with it.
      - name: Set up the Android SDK
        uses: ./.github/actions/setup-android-sdk

      # Caches the Gradle user home — the dependency cache and the local build cache — so a
      # run reuses the previous one's downloads and task outputs. Only default-branch runs
      # write the cache, so pull requests read a warm cache without poisoning it.
      #
      # The configuration cache is NOT carried across runs: `setup-gradle` only persists it
      # when given a `cache-encryption-key`, because a configuration-cache entry can contain
      # credentials read at configuration time. Enabling that means adding a repository
      # secret; until then each run pays configuration cost once, which is the smaller half.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build every module
        run: ./gradlew assemble

      - name: Unit tests
        run: ./gradlew test

      # `check` runs Android Lint, the repo-wide Media3 version verification, the tracked
      # public API surface checks, the Kotlin format and Apache-2.0 file headers, devicelab's
      # device-free self-test, and the build-logic test suite, which is an included build and
      # therefore invisible to the root build's `test` above.
      #
      # The QoE regression gate is not a step of its own: it is a unit test of `superplayer-abr`, so
      # `test` above runs it, and `docs/testing.md` says why it lives there rather than in a
      # benchmark step below.
      #
      # Spotless is configured by path rather than by project, so this covers the demo's and
      # build-logic's Kotlin files as well as the library modules'. `./gradlew spotlessApply`
      # is the local fix.
      #
      # The API surface checks are why there is no separate step for them: `check` is the whole
      # definition of passing, so a contributor running it locally sees exactly what CI sees.
      # A public API change that has not been regenerated with `./gradlew updateApiSurface`
      # fails here, as does an @UnstableApi Media3 type reaching public API.
      - name: Lint, API surface, and repo verification
        run: ./gradlew check

      - name: Publish to the local Maven repository
        run: ./gradlew publishToMavenLocal

      # The demo is a separate build that resolves SuperPlayer from published coordinates,
      # exactly as an adopter would, so a broken POM or a missing transitive dependency
      # fails here rather than in someone else's app.
      # Linted as well as built: lint configuration lives in the library convention plugin,
      # which the demo does not apply, so this is the only thing that lints it. It is also the
      # only place `UnsafeOptInUsageError` is enabled, which makes this step the proof of
      # ADR-0001 rule 2 from a consumer's side — a leaked @UnstableApi type that the library's
      # own checks somehow missed still fails here, at the call site, where it would hurt.
      # `spotlessCheck` is here rather than left to the root `check` for the same reason: the
      # demo applies Spotless itself, so its sources stay covered even when this step is the
      # only thing running.
      - name: Build and lint the demo against the published artifacts
        working-directory: demo
        run: ./gradlew assembleDebug lintDebug spotlessCheck

      # The benchmark is a third separate build, and it resolves SuperPlayer from published
      # coordinates exactly as the demo does — so this step, like the one above, is where a broken
      # POM or a missing transitive dependency surfaces.
      #
      # `test` rather than a matrix run: it is the harness's own tests plus the matrix at one run per
      # cell, which is what keeps the runner working between baselines without costing CI the
      # three quarters of an hour a real baseline takes. A benchmark is a measurement somebody reads
      # rather than a check a change must pass — `benchmark/README.md` says why — so nothing here
      # gates on a number.
      #
      # `spotlessCheck` for the same reason as the demo's: this build applies Spotless itself and CI
      # runs it with none of the root build running.
      - name: Build and smoke-run the benchmark against the published artifacts
        working-directory: benchmark
        run: ./gradlew assembleDebug test spotlessCheck

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Whether the iOS job below has anything to check. GitHub-hosted macOS minutes cost ten times
  # Linux's, so that job runs only for a change that touches what it reads (docs/ios-plan.md §2):
  # the Swift package, the documents both platforms share, the corpus generators the Swift fixtures
  # are to be held equal to, and this file. (Swift licence headers are the Linux job's, in `check`.)
  #
  # A job rather than a workflow-level `paths:` filter, because that would skip the Linux job too
  # and leave a pull request with no check at all; and a `git diff` rather than a third-party
  # path-filter action, because it is four lines and adds nothing to THIRD_PARTY.md. A manual
  # dispatch, and a push whose previous head is unknown, run the job rather than guess.
  ios-changes:
    name: Does this change touch iOS?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git fetch --no-tags --depth=1 origin "$BASE"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths='^(ios/|Package\.swift$|docs/|superplayer-testmedia/|\.github/workflows/ci\.yml$)'
          if git diff --name-only "$BASE" HEAD | grep -qE "$paths"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  # The iOS and tvOS Swift package. `ios/check` is the whole step, as `./gradlew check` is above:
  # swift-format, every test target on an iOS simulator, a tvOS build, and the API baselines under
  # ios/api. ios/CLAUDE.md says what each needs, and ADR-0021 why it is a script rather than a
  # Gradle task.
  ios:
    name: iOS package
    needs: ios-changes
    if: needs.ios-changes.outputs.ios == 'true'
    runs-on: macos-26
    # The empty package's run is a few minutes, most of it booting a simulator; 30 leaves room for a
    # cold runner and a first simulator creation, and stops a hung simulator well before macOS
    # minutes add up. It grows when the products have tests worth the time: 40 since #426, whose
    # tvOS run boots a second simulator beside a run that was already twenty minutes.
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Pinned rather than the image's default, which moves under the job when the image is updated:
      # the API baselines are the digester's reading, and a printed type name is the compiler's, so
      # an Xcode that changed between two runs could move a baseline nobody changed. 26.6 is the
      # newest release (not beta) on the image, and builds Swift 6 for the iOS 17 floor. Moving it is
      # a one-line change here and, if a baseline moves with it, an `ios/check --update-api` diff.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: ios/check
        run: ios/check
        # The tvOS run of SuperPlayerTVTests is required here, so an image without the runtime
        # fails rather than skips it (ios/check's header).
        env:
          SP_REQUIRE_TVOS: "1"

      - name: Upload the test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-check
          path: .build/ios-check/
          retention-days: 7
          if-no-files-found: ignore
