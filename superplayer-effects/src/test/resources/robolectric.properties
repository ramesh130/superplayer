# Robolectric ships a fixed set of Android runtimes and cannot run on an SDK level it has no
# android-all jar for, so it will not simply follow the `compileSdk` in the version catalog.
#
# The level is pinned rather than left to Robolectric's NEWEST_SDK because "newest" is also bounded
# by the JDK: each android-all jar declares a minimum Java version, and Robolectric 4.16's newest
# runtime (SDK 36) requires Java 21 while this project pins Java 17 (`jvmTarget` in the catalog).
# NEWEST_SDK therefore passes on a workstation whose Gradle daemon happens to run a newer JDK and
# fails in CI on Java 17 — the exact divergence a pinned level removes.
#
# SDK 35 is the newest runtime Robolectric 4.16 supports on Java 17. Raise it when either the
# Robolectric version or the project's Java version moves, and check the pairing rather than
# assuming: `DefaultSdkProvider` carries the required Java version per SDK.
#
# Tests that need a different level say so with @Config(sdk = [...]) on the test itself.
sdk=35
