# The device the harness boots when none is attached, and the one CI creates.
#
# One description, read by devicelab/lib/device.sh to boot it and by
# .github/actions/android-emulator to create it, so the device a laptop measures on and the one CI
# measures on differ only in what the host forces them to: the ABI.
#
# `avd` is the name CLAUDE.md's emulator section uses. The ABI is not written here because it is not
# a choice — an Apple-silicon Mac runs arm64-v8a images and a GitHub-hosted Linux runner runs x86_64
# ones — so it is chosen from the host, and recorded in every run's metadata.
avd=superplayer_verify_36
system_image_api=android-36.1
system_image_tag=google_apis
device_profile=pixel_6

# The television, beside the phone rather than instead of it: `lab --device tv` (or DEVICELAB_DEVICE=tv)
# reads these `tv.` keys, and every other run reads the bare ones above. Plain Android TV rather than
# Google TV, because API 36's Google TV images are published for 16 KB pages only, and the leanback
# launcher, the D-pad and the HDMI display the demo's TV screen needs are the same on both. `tv_1080p`
# is the panel most TVs the demo would be judged on have; a 4K profile costs the host memory the
# phone emulator beside it also needs.
tv.avd=superplayer_tv_36
tv.system_image_api=android-36
tv.system_image_tag=android-tv
tv.device_profile=tv_1080p
