# An emulator, booted and answering, for devicelab to run on. Expects setup-android-sdk first.
#
# Everything past enabling KVM is `devicelab/lab`: `create-avd` creates the AVD
# devicelab/device.properties describes — the same name, API, image and device profile a
# contributor's laptop boots, with the host's ABI — and `device` boots it and waits. So the device
# description, the ABI choice, the boot-wait and every workaround in it (an emulator listed `offline`
# while it boots; readiness read from `sys.boot_completed`, never from the device listing) exist
# once, in the harness, rather than once there and once here.
#
# Leaves ANDROID_SERIAL set for later steps, which `devicelab/lab` reads.
name: Boot the devicelab emulator
description: Creates and boots the AVD in devicelab/device.properties, and waits for it.

runs:
  using: composite
  steps:
    # GitHub's Linux runners have /dev/kvm but not the permission to open it. Without KVM the
    # emulator falls back to software emulation, which boots in tens of minutes and measures nothing
    # worth reading.
    # ref: https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
    - name: Enable KVM
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Create the AVD
      shell: bash
      run: devicelab/lab create-avd

    - name: Boot it and wait
      shell: bash
      run: |
        serial="$(devicelab/lab device --headless)"
        echo "ANDROID_SERIAL=$serial" >> "$GITHUB_ENV"
