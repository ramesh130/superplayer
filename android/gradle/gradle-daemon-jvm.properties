# Daemon JVM criteria: the Gradle daemon for this build (and the included build-logic) runs on
# Java 17, whatever JAVA_HOME the launcher was started with. Gradle picks a local JDK 17 of any
# vendor from JAVA_HOME, the PATH and the usual install locations, and fails naming the
# requirement when there is none. No download URLs are listed on purpose: provisioning is the
# developer's, not a toolchain resolver's. CI's matching JDK is `setup-java` in
# .github/workflows/ci.yml; the Robolectric SDK this pairs with is pinned in
# superplayer-core/src/test/resources/robolectric.properties.
#
# `./gradlew updateDaemonJvm` needs a toolchain resolver to write this file, and this build
# declares none, so edit the version here, and in demo/ and benchmark/, by hand.
toolchainVersion=17
